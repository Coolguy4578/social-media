<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <meta charset="UTF-8">
    <title>Talko - Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Talko - Share with care" />
<meta property="og:type" content="website" />
    <meta property="og:description" content="At Talko, we work tirelessly to make sure that your posts are shared with care. We love building experiences that transform the paradigm of social media, one bite at a time">
<meta property="og:url" content="https://wonder-hub.co/" />
<meta property="og:image" content="https://wonder-hub.co/static/talko.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Michroma&family=Momo+Trust+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/stylesheets/index.css">
</head>
<body>

 <header class="site-header">
  <div class="logo-area"><a href="/">
    <img alt="A geometric logo for Talko. A speech bubble is also a colorful taco bursting with sharp, colorful shapes representing meat, tomatoes and various toppings. Below the icon is a wordmark that says 'Talko' and the last letter is a bright red. Underneath the wordmark is black text saying 'Share with care' and the slogan 'You do the talking, we'll do the cooking'." src="/static/talko.png" class="logo">
  </a>
  </div>
    {% if session["logged_in"] %}
     <a class="profile-name login" href="/dashboard">Dashboard</a>
    <form action="/logout" method="post" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="profile-name login">Sign out</button>
    </form>
    {% else %}
<a href="/login" class="profile-name login">Login</a>
    <a href="/signup" class="profile-name login">Sign up</a>
    {% endif %}
  <!-- Profile Container -->
  <div class="profile-container">
    <img src="{{ session['image'] | default('/static/signed-out.jpg') }}" alt="{{ ('Profile image of ' ~ session['username']) if session['username'] else 'A grayscale icon of a signed out user.' }}" class="profile-img">
    <span class="profile-name">{{ session['username'] | default("Signed out") }}</span>
  </div>
</header>
      <h1 class="cool-font michroma-regular"><span class="talko-wordmark">Talk<span class="last-letter">o</span></span> - Dashboard</h1>
<div class="posts" id="postContainer">
    <form action="/api/create-post" method="post" class="post-form" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="post-title">Post Title <span class="required-icon">*</span></label>
        <input type="text" name="title" placeholder="Post Title" id="post-title" required>
        <label for="post-content">Post Content<span class="required-icon">*</span></label>
        <input type="text" name="textContent" placeholder="Post Content" id="post-content" required>
        <label for="post-image">Upload an image to your post.</label>
        <input type="file" name="image" id="post-image">
        <input type="submit" value="Submit">
    </form>

</div>
 <script>
   async function getJson(url) {
     const res = await fetch(url)
     if (!res.ok) throw new Error(url + " returned " + res.status)
     return res.json()
   }

   function el(tag, text) {
     const node = document.createElement(tag)
     // textContent never parses HTML, so user content can't inject markup
     if (text !== undefined) node.textContent = text
     return node
   }

   async function loadPosts() {
     const postContainer = document.getElementById("postContainer")
     let posts
     try {
       posts = await getJson("/api/posts")
     } catch (e) {
       postContainer.appendChild(el("p", "Couldn't load posts."))
       return
     }

     // Look up each author once, all in parallel
     const userIds = [...new Set(posts.map(post => post.user))]
     const authors = {}
     await Promise.all(userIds.map(async id => {
       try {
         authors[id] = await getJson("/api/users/" + encodeURIComponent(id))
       } catch (e) {
         authors[id] = null
       }
     }))

     // Appended in the order /api/posts returned them (newest first)
     posts.forEach((post, index) => {
       const postDiv = el("div")
       postDiv.id = "post-" + index
       postDiv.className = "post"
       postDiv.appendChild(el("h2", post.title))
       postDiv.appendChild(el("p", post.textContent))
       if (post.image) {
         const img = el("img")
         img.src = post.image
         img.alt = "User-generated post image"
         postDiv.appendChild(img)
       }
       const author = authors[post.user]
         let profileDiv = el("div")
         profileDiv.innerHTML = `
          <div class="profile-container">
    <img src="${author.image}" alt="Profile image of ${author.username}" class="profile-img">
    <span class="profile-name">${author.username}</span>
  </div>`
         postDiv.appendChild(profileDiv)
       // postDiv.appendChild(el("p", "Posted by " + (author ? author.username : "an unknown user")))
       postContainer.appendChild(postDiv)
     })
   }

   loadPosts()
 </script>

</body>
</html>
