<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <meta charset="UTF-8">
    <title>Talko - Login</title>
 <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Michroma&family=Momo+Trust+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/stylesheets/index.css">
  <meta property="og:title" content="Talko - Share with care" />
<meta property="og:type" content="website" />
    <meta property="og:description" value="At Talko, we work tirelessly to make sure that your posts are shared with care. We love building experiences that transform the paradigm of social media, one bite at a time">
<meta property="og:url" content="https://wonder-hub.co/" />
<meta property="og:image" content="https://wonder-hub.co/static/talko.png" />
</head>
<body>
<!--<header><div class="logo-area"><a href="/"><img alt="A geometric logo for Talko. A speech bubble is also a colorful taco bursting with sharp, colorful shapes representing meat, tomatoes and various toppings. Below the icon is a wordmark that says 'Talko' and the last letter is a bright red. Underneath the wordmark is black text saying 'Share with care' and the slogan 'You do the talking, we'll do the cooking'." src="/static/talko.png" class="logo"></a></div><p>Signed out</p><div class="user-box"><img alt="A photo of a signed out user." src="/static/signed-out.jpg"></div></header>-->
<header class="site-header">
  <div class="logo"><a href="/">
    <img alt="A geometric logo for Talko. A speech bubble is also a colorful taco bursting with sharp, colorful shapes representing meat, tomatoes and various toppings. Below the icon is a wordmark that says 'Talko' and the last letter is a bright red. Underneath the wordmark is black text saying 'Share with care' and the slogan 'You do the talking, we'll do the cooking'." src="/static/talko.png" class="logo">
  </a>
  </div>
<a href="/login" class="profile-name login">Login</a>
    <a href="/signup" class="profile-name login">Sign up</a>
  <!-- Profile Container -->
  <div class="profile-container">
    <img src="/static/signed-out.jpg" alt="A grayscale icon of a signed out user." class="profile-img">
    <span class="profile-name">{{ username | default("Signed out") }}</span>
  </div>
</header>
{% if username %}
<h1>Login successful</h1>
{% elif fail %}
<h1>Incorrect password</h1>
{% else %}
<h1>No login attempt</h1>
{% endif %}
<h1 class="cool-font michroma-regular"><span class="talko-wordmark">Talk<span class="last-letter">o</span></span> - Login</h1>
<form action="/login" method="post">
<label for="username">Enter your username: <span class="required-icon">*</span></label>
    <br>
    <input name="username" id="username" required type="text">
    <br>
    <label for="password">Enter your password: <span class="required-icon">*</span></label>
    <br>
    <input name="password" id="password" required type="password">
    <br>
    <input type="submit" value="Sign in">
</form>
</body>
</html>
